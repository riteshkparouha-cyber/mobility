  # ─────────────────────────────────────────────────────────────────────────────
  # on_confirm
  # ─────────────────────────────────────────────────────────────────────────────

  on_confirm:
    bapMappings: |
      (
        $ctx      := $.context;
        $contract := $.message.contract;
        $parts    := $split($ctx.networkId, ":");
        $domain   := $parts[0] & ":" & $parts[1];
        $commit   := $contract.commitments[0];
        $res      := $commit.resources[0];
        $rAttr    := $res.resourceAttributes;
        $oAttr    := $commit.offer.offerAttributes;
        $perf     := $contract.performance[0];
        $pAttr    := $perf.performanceAttributes;
        $pax      := $contract.participants[participantAttributes."@type" = "Passenger"][0];
        $paxAttr  := $pax.participantAttributes;
        $bppPart  := $contract.participants[role = "BPP"][0];
        $settle   := $contract.settlements[0];
        $sAttr    := $settle.settlementAttributes;
        $ca       := $commit.offer.considerations[0].considerationAttributes;

        $toV1Status := function($v2Code) {
          $v2Code = "ACTIVE" ? "RIDE_CONFIRMED" :
          $v2Code = "CLOSED" ? "RIDE_COMPLETED" : "RIDE_CONFIRMED"
        };
        $statusCode := $toV1Status($contract.status.code);

        {
          "context": {
            "version": "2.1.0",
            "action": "on_confirm",
            "domain": $domain,
            "location": {
              "city":    { "code": $parts[3] & ":" & $parts[4] },
              "country": { "code": $parts[2] }
            },
            "bap_id":  $ctx.bapId,
            "bap_uri": $ctx.bapUri,
            "bpp_id":  $ctx.bppId,
            "bpp_uri": $ctx.bppUri,
            "transaction_id": $ctx.transactionId,
            "message_id": $ctx.messageId,
            "timestamp": $ctx.timestamp,
            "ttl": $ctx.ttl
          },
          "message": {
            "order": {
              "id": $contract.id,
              "created_at": $contract.createdAt,
              "provider": { "id": $bppPart.id },
              "items": [$merge([
                {
                  "id": $res.id,
                  "descriptor": $merge([
                    $res.descriptor.name     ? { "name": $res.descriptor.name }           : {},
                    $res.descriptor.code     ? { "code": $res.descriptor.code }           : {},
                    $res.descriptor.shortDesc ? { "short_desc": $res.descriptor.shortDesc } : {}
                  ]),
                  "category_ids": $oAttr.categoryIds,
                  "fulfillment_ids": [$perf.id],
                  "payment_ids": [$settle.id]
                },
                $ca ? { "price": {
                  "currency": $ca.currency,
                  "value": $string($ca.value),
                  "offered_value": $string($ca.value)
                } } : {},
                $rAttr.tags ? { "tags": $rAttr.tags } : {}
              ])],
              "fulfillments": [$merge([
                {
                  "id": $perf.id,
                  "type": $rAttr.fulfillmentType,
                  "vehicle": {
                    "category": $pAttr.vehicleCategory,
                    "variant": $pAttr.vehicleVariant
                  },
                  "customer": {
                    "contact": { "phone": $pAttr.customer.contact.phone },
                    "person": {
                      "name": $pAttr.customer.person.name,
                      "gender": $pAttr.customer.person.gender
                    }
                  },
                  "stops": $rAttr.stops ? $rAttr.stops : [],
                  "state": { "descriptor": { "code": $statusCode, "name": $statusCode } }
                },
                $pAttr.agent ? { "agent": $pAttr.agent } : {}
              ])],
              "billing": $paxAttr ? {
                "name": $paxAttr.billingName,
                "phone": $paxAttr.billingPhone
              } : undefined,
              "payments": $settle ? [{
                "id": $settle.id,
                "collected_by": $sAttr.collectedBy,
                "status": $sAttr.paymentStatus,
                "type": $sAttr.paymentType,
                "tags": $sAttr.tags
              }] : [],
              "cancellation_terms": $contract.cancellationTerms,
              "quote": $ca ? {
                "price": { "currency": $ca.currency, "value": $string($ca.value) },
                "breakup": $ca.breakup
              } : undefined
            }
          }
        }
      )
    bppMappings: |
      (
        $ctx  := $.context;
        $ord  := $.message.order;
        $ful  := $ord.fulfillments[0];
        $item := $ord.items[0];
        $bill := $ord.billing;
        $pay  := $ord.payments[0];
        $cust := $ful.customer;
        $agent := $ful.agent;
        $tripCtx := "https://schema.beckn.io/TripRequest/v2.2/context.jsonld";
        $rideCtx := "https://schema.beckn.io/RideOption/v2.1/context.jsonld";
        $passCtx := "https://schema.beckn.io/Passenger/v2.1/context.jsonld";
        $stCtx   := "https://schema.beckn.io/SettlementTerm/v2.1/context.jsonld";
        $drvCtx  := "https://schema.beckn.io/Driver/v2.1/context.jsonld";

        $gpsToCoords := function($gps) {(
          $p := $split($gps, ",");
          [$number($trim($p[1])), $number($trim($p[0]))]
        )};

        $s0 := $ful.stops[type = "START"][0];
        $s1 := $ful.stops[type = "END"][0];

        $toV2Status := function($v1Code) {
          $v1Code = "RIDE_CONFIRMED" ? "ACTIVE" :
          $v1Code = "RIDE_COMPLETED" ? "CLOSED" : "ACTIVE"
        };
        $v2Status := $toV2Status($ful.state.descriptor.code);

        {
          "context": {
            "version": "2.0.0",
            "action": "on_confirm",
            "networkId": $ctx.domain & ":" & $ctx.location.country.code & ":" & $ctx.location.city.code,
            "bapId": $ctx.bap_id,
            "bapUri": $ctx.bap_uri,
            "bppId": $ctx.bpp_id,
            "bppUri": $ctx.bpp_uri,
            "transactionId": $ctx.transaction_id,
            "messageId": $ctx.message_id,
            "timestamp": $ctx.timestamp,
            "ttl": $ctx.ttl
          },
          "message": {
            "contract": {
              "id": $ord.id,
              "createdAt": $ord.created_at,
              "updatedAt": $ctx.timestamp,
              "status": { "code": $v2Status },
              "commitments": [{
                "id": "commitment-1",
                "status": { "descriptor": { "code": $v2Status } },
                "resources": [{
                  "id": $ful.id,
                  "descriptor": $merge([
                    $item.descriptor.name     ? { "name": $item.descriptor.name }           : {},
                    $item.descriptor.code     ? { "code": $item.descriptor.code }           : {},
                    $item.descriptor.short_desc ? { "shortDesc": $item.descriptor.short_desc } : {}
                  ]),
                  "quantity": { "value": 1, "unit": "trip" },
                  "resourceAttributes": $merge([
                    {
                      "@context": $tripCtx,
                      "@type": "TripRequest",
                      "vehicleVariant": $ful.vehicle.variant,
                      "vehicleCategory": $ful.vehicle.category,
                      "fulfillmentType": $ful.type,
                      "stops": $ful.stops
                    },
                    $s0 ? { "origin": { "geo": { "type": "Point", "coordinates": $gpsToCoords($s0.location.gps) } } } : {},
                    $s1 ? { "destination": { "geo": { "type": "Point", "coordinates": $gpsToCoords($s1.location.gps) } } } : {},
                    $item.tags ? { "tags": $item.tags } : {}
                  ])
                }],
                "offer": {
                  "id": $item.id,
                  "resourceIds": [$ful.id],
                  "offerAttributes": {
                    "@context": $rideCtx,
                    "@type": "RideOption",
                    "categoryIds": $item.category_ids,
                    "fulfillmentIds": [$ful.id]
                  },
                  "considerations": $item.price ? [{
                    "id": "fare-" & $item.id,
                    "status": { "code": $v2Status },
                    "considerationAttributes": {
                      "currency": $item.price.currency,
                      "value": $number($item.price.value)
                    }
                  }] : []
                }
              }],
              "performance": [$merge([
                {
                  "id": $ful.id,
                  "status": { "code": $ful.state.descriptor.code, "name": $ful.state.descriptor.name },
                  "commitmentIds": ["commitment-1"],
                  "performanceAttributes": $merge([
                    {
                      "vehicleCategory": $ful.vehicle.category,
                      "vehicleVariant": $ful.vehicle.variant,
                      "customer": {
                        "contact": { "phone": $cust.contact.phone },
                        "person": { "name": $cust.person.name, "gender": $cust.person.gender }
                      }
                    },
                    $agent ? { "agent": {
                      "@context": $drvCtx,
                      "@type": "Driver",
                      "name": $agent.person.name,
                      "gender": $agent.person.gender,
                      "phone": $agent.contact.phone,
                      "tags": $agent.person.tags
                    } } : {}
                  ])
                }
              ])],
              "participants": [
                $merge([
                  { "id": "consumer-001" },
                  $bill ? {
                    "participantAttributes": {
                      "@context": $passCtx,
                      "@type": "Passenger",
                      "person": { "name": $cust.person.name, "gender": $cust.person.gender, "telephone": $cust.contact.phone },
                      "billingName": $bill.name,
                      "billingPhone": $bill.phone
                    }
                  } : {}
                ]),
                { "id": $ctx.bpp_id, "role": "BPP" }
              ],
              "settlements": $pay ? [{
                "id": $pay.id,
                "status": $v2Status,
                "settlementAttributes": {
                  "@context": $stCtx,
                  "@type": "SettlementTerm",
                  "collectedBy": $pay.collected_by,
                  "paymentStatus": $pay.status,
                  "paymentType": $pay.type,
                  "tags": $pay.tags
                }
              }] : [],
              "cancellationTerms": $ord.cancellation_terms
            }
          }
        }
      )

  # ─────────────────────────────────────────────────────────────────────────────
  # on_update  (ride lifecycle events: RIDE_ASSIGNED, RIDE_STARTED, etc.)
  # ─────────────────────────────────────────────────────────────────────────────

  on_update:
    bapMappings: |
      (
        $ctx      := $.context;
        $contract := $.message.contract;
        $parts    := $split($ctx.networkId, ":");
        $domain   := $parts[0] & ":" & $parts[1];
        $commit   := $contract.commitments[0];
        $res      := $commit.resources[0];
        $rAttr    := $res.resourceAttributes;
        $oAttr    := $commit.offer.offerAttributes;
        $perf     := $contract.performance[0];
        $pAttr    := $perf.performanceAttributes;
        $bppPart  := $contract.participants[role = "BPP"][0];
        $settle   := $contract.settlements[0];
        $sAttr    := $settle.settlementAttributes;
        $ca       := $commit.offer.considerations[0].considerationAttributes;

        $toV1Status := function($v2Code) {
          $v2Code = "ACTIVE"     ? "RIDE_CONFIRMED"  :
          $v2Code = "CLOSED"     ? "RIDE_COMPLETED"  :
          $v2Code = "CANCELLED"  ? "RIDE_CANCELLED"  : $v2Code
        };
        $statusCode := $perf.status.code ? $toV1Status($perf.status.code) : "RIDE_CONFIRMED";

        {
          "context": {
            "version": "2.1.0",
            "action": "on_update",
            "domain": $domain,
            "location": {
              "city":    { "code": $parts[3] & ":" & $parts[4] },
              "country": { "code": $parts[2] }
            },
            "bap_id":  $ctx.bapId,
            "bap_uri": $ctx.bapUri,
            "bpp_id":  $ctx.bppId,
            "bpp_uri": $ctx.bppUri,
            "transaction_id": $ctx.transactionId,
            "message_id": $ctx.messageId,
            "timestamp": $ctx.timestamp,
            "ttl": $ctx.ttl
          },
          "message": {
            "order": {
              "id": $contract.id,
              "provider": { "id": $bppPart.id },
              "items": [$merge([
                {
                  "id": $res.id,
                  "descriptor": $merge([
                    $res.descriptor.name     ? { "name": $res.descriptor.name }           : {},
                    $res.descriptor.code     ? { "code": $res.descriptor.code }           : {},
                    $res.descriptor.shortDesc ? { "short_desc": $res.descriptor.shortDesc } : {}
                  ]),
                  "category_ids": $oAttr.categoryIds,
                  "fulfillment_ids": [$perf.id]
                },
                $ca ? { "price": {
                  "currency": $ca.currency,
                  "value": $string($ca.value),
                  "offered_value": $string($ca.value)
                } } : {},
                $rAttr.tags ? { "tags": $rAttr.tags } : {}
              ])],
              "fulfillments": [$merge([
                {
                  "id": $perf.id,
                  "type": $rAttr.fulfillmentType,
                  "vehicle": {
                    "category": $pAttr.vehicleCategory,
                    "variant": $pAttr.vehicleVariant
                  },
                  "customer": $pAttr.customer,
                  "stops": $rAttr.stops ? $rAttr.stops : [],
                  "state": { "descriptor": { "code": $statusCode, "name": $perf.status.name } }
                },
                $pAttr.agent ? { "agent": $pAttr.agent } : {}
              ])],
              "payments": $settle ? [{
                "id": $settle.id,
                "collected_by": $sAttr.collectedBy,
                "status": $sAttr.paymentStatus,
                "type": $sAttr.paymentType,
                "tags": $sAttr.tags
              }] : [],
              "quote": $ca ? {
                "price": { "currency": $ca.currency, "value": $string($ca.value) },
                "breakup": $ca.breakup
              } : undefined,
              "cancellation_terms": $contract.cancellationTerms
            }
          }
        }
      )
    bppMappings: |
      (
        $ctx  := $.context;
        $ord  := $.message.order;
        $ful  := $ord.fulfillments[0];
        $item := $ord.items[0];
        $pay  := $ord.payments[0];
        $cust := $ful.customer;
        $agent := $ful.agent;
        $tripCtx := "https://schema.beckn.io/TripRequest/v2.2/context.jsonld";
        $rideCtx := "https://schema.beckn.io/RideOption/v2.1/context.jsonld";
        $stCtx   := "https://schema.beckn.io/SettlementTerm/v2.1/context.jsonld";
        $drvCtx  := "https://schema.beckn.io/Driver/v2.1/context.jsonld";

        $gpsToCoords := function($gps) {(
          $p := $split($gps, ",");
          [$number($trim($p[1])), $number($trim($p[0]))]
        )};

        $s0 := $ful.stops[type = "START"][0];
        $s1 := $ful.stops[type = "END"][0];

        $toV2Status := function($v1Code) {
          $contains($v1Code, "CANCELLED") ? "CANCELLED" :
          $contains($v1Code, "COMPLETED") ? "CLOSED" : "ACTIVE"
        };
        $v2Status := $toV2Status($ful.state.descriptor.code);

        {
          "context": {
            "version": "2.0.0",
            "action": "on_update",
            "networkId": $ctx.domain & ":" & $ctx.location.country.code & ":" & $ctx.location.city.code,
            "bapId": $ctx.bap_id,
            "bapUri": $ctx.bap_uri,
            "bppId": $ctx.bpp_id,
            "bppUri": $ctx.bpp_uri,
            "transactionId": $ctx.transaction_id,
            "messageId": $ctx.message_id,
            "timestamp": $ctx.timestamp,
            "ttl": $ctx.ttl
          },
          "message": {
            "contract": {
              "id": $ord.id,
              "updatedAt": $ctx.timestamp,
              "status": { "code": $v2Status },
              "commitments": [{
                "id": "commitment-1",
                "status": { "descriptor": { "code": $v2Status } },
                "resources": [{
                  "id": $ful.id,
                  "descriptor": $merge([
                    $item.descriptor.name     ? { "name": $item.descriptor.name }           : {},
                    $item.descriptor.code     ? { "code": $item.descriptor.code }           : {},
                    $item.descriptor.short_desc ? { "shortDesc": $item.descriptor.short_desc } : {}
                  ]),
                  "quantity": { "value": 1, "unit": "trip" },
                  "resourceAttributes": $merge([
                    {
                      "@context": $tripCtx,
                      "@type": "TripRequest",
                      "vehicleVariant": $ful.vehicle.variant,
                      "vehicleCategory": $ful.vehicle.category,
                      "fulfillmentType": $ful.type,
                      "stops": $ful.stops
                    },
                    $s0 ? { "origin": { "geo": { "type": "Point", "coordinates": $gpsToCoords($s0.location.gps) } } } : {},
                    $s1 ? { "destination": { "geo": { "type": "Point", "coordinates": $gpsToCoords($s1.location.gps) } } } : {},
                    $item.tags ? { "tags": $item.tags } : {}
                  ])
                }],
                "offer": {
                  "id": $item.id,
                  "resourceIds": [$ful.id],
                  "offerAttributes": {
                    "@context": $rideCtx,
                    "@type": "RideOption",
                    "categoryIds": $item.category_ids,
                    "fulfillmentIds": [$ful.id]
                  },
                  "considerations": $item.price ? [{
                    "id": "fare-" & $item.id,
                    "status": { "code": $v2Status },
                    "considerationAttributes": {
                      "currency": $item.price.currency,
                      "value": $number($item.price.value),
                      "breakup": $ord.quote.breakup
                    }
                  }] : []
                }
              }],
              "performance": [$merge([
                {
                  "id": $ful.id,
                  "status": { "code": $ful.state.descriptor.code, "name": $ful.state.descriptor.name },
                  "commitmentIds": ["commitment-1"],
                  "performanceAttributes": $merge([
                    {
                      "vehicleCategory": $ful.vehicle.category,
                      "vehicleVariant": $ful.vehicle.variant,
                      "customer": $cust
                    },
                    $agent ? { "agent": {
                      "@context": $drvCtx,
                      "@type": "Driver",
                      "name": $agent.person.name,
                      "gender": $agent.person.gender,
                      "phone": $agent.contact.phone,
                      "tags": $agent.person.tags
                    } } : {}
                  ])
                }
              ])],
              "settlements": $pay ? [{
                "id": $pay.id,
                "status": $v2Status,
                "settlementAttributes": {
                  "@context": $stCtx,
                  "@type": "SettlementTerm",
                  "collectedBy": $pay.collected_by,
                  "paymentStatus": $pay.status,
                  "paymentType": $pay.type,
                  "tags": $pay.tags
                }
              }] : [],
              "cancellationTerms": $ord.cancellation_terms
            }
          }
        }
      )
