                },
                $ca ? { "price": { "currency": $ca.currency, "value": $string($ca.value) } } : {},
                $rAttr.tags ? { "tags": $rAttr.tags } : {}
              ])],
              "fulfillments": [$merge([
                {
                  "id": $perf.id,
